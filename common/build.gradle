plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Datagen runs from :neoforge and writes here. Checked in, and shipped to every loader.
sourceSets.main.resources.srcDir 'src/generated/resources'

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    // Not 'sourceDirectories.singleFile' - that throws once there is more than one source dir, which the
    // generated-resources dir above guarantees.
    sourceSets.main.java.srcDirs.each { commonJava it }
    sourceSets.main.resources.srcDirs.each { commonResources it }
}

// The build geometry is pure position maths, so it is tested without booting Minecraft.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

// moddev puts Minecraft only on the main source set, so the tests would not see BlockPos otherwise.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
